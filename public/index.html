<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="application-name" content="daywoven" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="daywoven" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/healthi-icon-192.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        background: #000000;
        height: 100%;
        margin: 0;
        overscroll-behavior-y: none;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        flex: 1;
        height: 100%;
        min-height: 100%;
      }

      /*
       * Long-pressing a control in a mobile browser selects its label, which is the
       * single clearest tell that an app is a web page. Interface chrome opts out;
       * anything a person might legitimately want to copy — their own entries, and
       * every form field — opts back in below.
       */
      #root {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      input,
      textarea,
      [contenteditable="true"],
      [data-selectable="true"] {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run daywoven.</noscript>
    <div id="root"></div>
  </body>
</html>
