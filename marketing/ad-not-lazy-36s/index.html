<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-var.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("fonts/InstrumentSerif-Italic.woff2") format("woff2");
        font-style: italic;
        font-weight: 400;
      }
      :root {
        --ink: #0b1f19;
        --muted: #66756e;
        --canvas: #f2efe9;
        --mint: #3dd6a3;
        --mint-deep: #11875f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--canvas);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--canvas);
        font-family: "Inter", sans-serif;
        color: var(--ink);
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .light {
        background: radial-gradient(110% 70% at 50% 42%, #fbfaf7 0%, #f2efe9 62%, #e8e3da 100%);
      }
      .mintbg {
        background: radial-gradient(90% 60% at 50% 40%, #6fe6be 0%, #3dd6a3 55%, #22bb8b 100%);
      }
      svg.full {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .t {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.04;
      }
      .it {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -0.005em;
      }
      .word {
        display: inline-block;
      }
      .sphere {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #ffffff 0%, #d9f8ec 22%, #8be8c6 58%, #3cc89a 100%);
        box-shadow: 0 26px 50px rgba(18, 90, 66, 0.16);
      }
      .sphere.white {
        background: radial-gradient(circle at 34% 30%, #ffffff 0%, #f3fffa 30%, #c3f3df 70%, #95e7c7 100%);
        box-shadow: 0 30px 60px rgba(10, 70, 50, 0.2);
      }
      .label {
        position: absolute;
        left: 0;
        right: 0;
        top: 330px;
        text-align: center;
        font-size: 70px;
        font-weight: 800;
        letter-spacing: -0.035em;
      }
      .plus {
        position: absolute;
        left: 740px;
        top: 700px;
        font-size: 110px;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: var(--mint-deep);
      }
      .pillar {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 34px 20px 26px;
        border-radius: 999px;
        background: #ffffff;
        font-size: 42px;
        font-weight: 750;
        letter-spacing: -0.02em;
        box-shadow: 0 18px 40px rgba(30, 40, 30, 0.12);
        white-space: nowrap;
      }
      .pillar i {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: block;
      }
      .pill {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        padding: 30px 64px;
        border-radius: 999px;
        background: var(--ink);
        color: #ffffff;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";

      // Small helpers. Every tween is placed at an absolute second, so the timeline is deterministic.
      const fadeUp = (sel, t, d = 0.45, y = 40) => tl.fromTo(sel, { y, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: d, ease: E }, t);
      const out = (sel, t, d = 0.22) => tl.to(sel, { autoAlpha: 0, y: -24, duration: d, ease: "power2.in" }, t);
      const pop = (sel, t, d = 0.45, from = 0) => tl.fromTo(sel, { scale: from, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: d, ease: "back.out(1.8)" }, t);
      const slam = (sel, t, from = 1.6) => tl.fromTo(sel, { scale: from, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.28, ease: "power4.out" }, t);
      const draw = (sel, t, d = 0.5, ease = "power2.inOut") => {
        document.querySelectorAll(sel).forEach((el, i) => {
          const len = el.getTotalLength();
          // Hidden until it starts drawing: a fully offset dash still shows its round end cap as a dot.
          tl.set(el, { opacity: 0 }, 0);
          tl.set(el, { opacity: 1 }, t + i * 0.08);
          tl.fromTo(el, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: d, ease }, t + i * 0.08);
        });
      };
      const count = (el, from, to, t, d, ease = "power2.out") => {
        const p = { v: from };
        tl.fromTo(p, { v: from }, { v: to, duration: d, ease, immediateRender: false, onUpdate: () => (document.querySelector(el).textContent = String(Math.round(p.v))) }, t);
      };
      const drift = (sel, t, d, dist = 40) =>
        document.querySelectorAll(sel).forEach((el, i) =>
          tl.fromTo(el, { y: 0, x: 0 }, { y: (i % 2 ? -1 : 1) * dist, x: ((i % 3) - 1) * dist * 0.5, duration: d, ease: "sine.inOut" }, t),
        );
      // The orb's size and shape: squashed and small when tired, round and full when it's back.
      const orb = (t, s, sx, sy, d = 0.6, ease = "elastic.out(1, 0.5)") =>
        tl.to("#o-all", { scaleX: s * sx, scaleY: s * sy, svgOrigin: "540 1250", duration: d, ease }, t);
      // A "+N" floats up beside the orb and fades.
      const plus = (sel, t) => {
        tl.fromTo(sel, { y: 40, autoAlpha: 0, scale: 0.6 }, { y: 0, autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, t);
        tl.to(sel, { y: -90, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, t + 0.75);
      };

      // 1 · The hook: spheres bubble up, "You're not" ticks on, LAZY slams and gets struck through.
      drift(".l1-sp", 0, 1.95, 40);
      document.querySelectorAll(".l1-sp").forEach((el, i) => pop(el, 0.02 + i * 0.08, 0.45));
      tl.fromTo("#l1-top .word", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.3 }, 0.14);
      slam("#l1-lazy", 0.62, 1.8);
      tl.fromTo("#l1-lazy .word", { y: 0 }, { y: -24, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.04 }, 0.9);
      draw("#l1-strike", 1.12, 0.32, "power2.out");
      tl.to(["#l1-top", "#l1-lazy", "#l1-strike"], { y: 40, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 1.68);

      // 2 · The orb drops in, tired and squashed: running on 54.
      drift(".l2-sp", 1.95, 20.5, 36);
      document.querySelectorAll(".l2-sp").forEach((el, i) => pop(el, 2.0 + i * 0.07, 0.4));
      tl.set(["#lb1", "#lb2", "#lb3", "#lb4", "#lb5", "#lb6", "#pl1", "#pl2", "#pl3", "#pl4", "#h-moon", "#h-sun", "#h-glow", "#h-bowl", "#h-cloud", ".h-spark", "#o-qdot", "#o-smile"], { autoAlpha: 0 }, 0);
      tl.set("#o-all", { scaleX: 0.82 * 1.12, scaleY: 0.82 * 0.82, svgOrigin: "540 1250" }, 0);
      tl.set("#o-eyes", { scaleY: 0.5, transformOrigin: "50% 50%" }, 0);
      tl.fromTo("#o-drop", { y: -900 }, { y: 0, duration: 0.42, ease: "power2.in" }, 1.95);
      orb(2.37, 0.82, 1.2, 0.72, 0.12, "power2.out");
      orb(2.49, 0.82, 1.12, 0.82, 0.6);
      fadeUp("#lb0", 2.0, 0.35, 24);
      // Between moments it floats gently, so it never sits dead still (ends back at rest before the bounce).
      tl.fromTo("#o-drop", { y: 0 }, { y: -10, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 19, immediateRender: false }, 2.6);
      tl.fromTo("#o-shadow", { attr: { rx: 60 }, opacity: 0 }, { attr: { rx: 200 }, opacity: 0.12, duration: 0.42, ease: "power2.in" }, 1.95);

      // Nobody tells you how to get the rest back: it looks up at a question mark, and shrugs.
      tl.to(".o-pupil", { y: -10, x: 4, duration: 0.25, ease: E }, 3.4);
      draw("#o-q", 3.5, 0.55, "power2.out");
      tl.fromTo("#o-qdot", { scale: 0, autoAlpha: 0, transformOrigin: "50% 50%" }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.5)" }, 4.1);
      orb(4.9, 0.82, 1.2, 0.76, 0.12, "power2.out");
      orb(5.02, 0.82, 1.12, 0.82, 0.45);
      tl.to(["#o-q", "#o-qdot", "#lb0"], { autoAlpha: 0, duration: 0.2 }, 5.6);
      tl.to(".o-pupil", { y: 0, x: 0, duration: 0.2 }, 5.6);

      // 1 · Lights out by 11: the moon floats in, swoops over the orb in sparkles. Plus twelve.
      fadeUp("#lb1", 6.0, 0.35, 24);
      tl.fromTo("#h-moon", { x: -260, y: -160, autoAlpha: 0, rotation: -30, transformOrigin: "50% 50%" }, { x: 0, y: 0, autoAlpha: 1, rotation: 0, transformOrigin: "50% 50%", duration: 0.55, ease: "back.out(1.4)" }, 6.1);
      tl.to("#h-moon", { y: -14, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.65);
      tl.to("#h-moon", { x: 470, y: -80, rotation: 40, transformOrigin: "50% 50%", duration: 0.55, ease: "power2.inOut" }, 7.2);
      tl.fromTo(".h-spark", { scale: 0, autoAlpha: 0, transformOrigin: "50% 50%" }, { scale: 1, autoAlpha: 1, duration: 0.25, ease: "back.out(3)", stagger: 0.08 }, 7.3);
      tl.to(".h-spark", { autoAlpha: 0, scale: 0.4, duration: 0.3, stagger: 0.06 }, 7.9);
      plus("#pl1", 7.66);
      count("#o-num", 54, 66, 7.68, 0.45);
      orb(7.7, 0.88, 1.08, 0.88);
      tl.to("#o-eyes", { scaleY: 0.7, transformOrigin: "50% 50%", duration: 0.3 }, 7.75);
      tl.to("#h-moon", { x: 900, y: -500, autoAlpha: 0, duration: 0.45, ease: "power2.in" }, 8.05);
      out("#lb1", 8.3);

      // 2 · Ten minutes of morning light: the sun rises bottom-right, its rays turn, it shines. Plus eight.
      fadeUp("#lb2", 8.48, 0.35, 24);
      tl.fromTo("#h-sun", { y: 500, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: E }, 8.6);
      tl.fromTo("#h-rays", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 90, transformOrigin: "50% 50%", duration: 2.2, ease: "none" }, 8.6);
      tl.fromTo("#h-glow", { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1.3, duration: 0.6, ease: E }, 9.9);
      tl.fromTo("#o-glow", { opacity: 0 }, { opacity: 0.9, duration: 0.5 }, 10.0);
      tl.to("#o-shine", { opacity: 0.85, duration: 0.5 }, 10.0);
      plus("#pl2", 10.3);
      count("#o-num", 66, 74, 10.32, 0.4);
      orb(10.34, 0.93, 1.05, 0.93);
      tl.to("#o-eyes", { scaleY: 0.85, transformOrigin: "50% 50%", duration: 0.3 }, 10.4);
      tl.to(["#h-sun", "#h-glow"], { y: 520, autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 10.75);
      tl.to("#o-glow", { opacity: 0, duration: 0.6 }, 10.8);
      out("#lb2", 10.85);

      // 3 · A real lunch: the bowl slides in, flips its food into the orb, one bite at a time. Plus seven.
      fadeUp("#lb3", 11.04, 0.35, 24);
      tl.fromTo("#h-bowl", { x: 360, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(1.5)" }, 11.1);
      tl.to("#h-bowl", { rotation: -24, transformOrigin: "50% 60%", duration: 0.25, ease: "power2.out" }, 11.65);
      document.querySelectorAll(".h-food").forEach((el, i) =>
        tl.to(el, { x: -330 + i * 12, y: -180 + i * 18, scale: 0.4, autoAlpha: 0, duration: 0.32, ease: "power2.in" }, 11.75 + i * 0.1),
      );
      plus("#pl3", 12.3);
      count("#o-num", 74, 81, 12.32, 0.4);
      orb(12.34, 0.97, 1.03, 0.97);
      tl.to("#h-bowl", { rotation: 0, transformOrigin: "50% 60%", duration: 0.25 }, 12.2);
      tl.to("#h-bowl", { x: 380, autoAlpha: 0, duration: 0.35, ease: "power2.in" }, 12.7);
      out("#lb3", 12.85);

      // 4 · Two minutes of breathing at three: the cloud breathes in with the orb, then out. Plus five.
      fadeUp("#lb4", 13.04, 0.35, 24);
      tl.fromTo("#h-cloud", { x: -340, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "back.out(1.4)" }, 13.1);
      tl.to("#h-cloudbody", { scale: 1.22, transformOrigin: "50% 70%", duration: 0.75, ease: "sine.inOut" }, 13.65);
      orb(13.65, 1.02, 1.0, 1.02, 0.75, "sine.inOut");
      tl.to("#h-cloudbody", { scale: 0.9, transformOrigin: "50% 70%", duration: 0.7, ease: "sine.inOut" }, 14.4);
      orb(14.4, 0.98, 1.02, 0.98, 0.7, "sine.inOut");
      plus("#pl4", 15.1);
      count("#o-num", 81, 86, 15.12, 0.35);
      tl.to("#h-cloud", { x: -360, autoAlpha: 0, duration: 0.35, ease: "power2.in" }, 15.5);
      out("#lb4", 15.6);

      // Eighty-six. Same you: the orb fills out round and glossy, eyes wide, a smile, a happy bounce.
      orb(16.05, 1.0, 1.0, 1.0, 0.7);
      tl.fromTo("#o-num", { scale: 1.25, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "power4.out", immediateRender: false }, 16.08);
      tl.to("#o-shine", { opacity: 1, duration: 0.4 }, 16.1);
      tl.to("#o-eyes", { scaleY: 1.05, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(2)" }, 16.2);
      tl.to("#o-lids", { autoAlpha: 0, duration: 0.15 }, 16.2);
      tl.to("#o-flat", { autoAlpha: 0, duration: 0.12 }, 16.3);
      tl.to("#o-smile", { autoAlpha: 1, duration: 0.15 }, 16.32);
      tl.fromTo("#lb5", { scale: 1.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "power4.out" }, 16.86);
      tl.to("#o-drop", { y: -70, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 }, 16.95);
      out("#lb5", 17.85);

      // The fixes were never the hard part: all four helpers crowd in at once and circle it.
      tl.to(["#h-moon", "#h-sun", "#h-bowl", "#h-cloud"], { autoAlpha: 0, duration: 0.01 }, 17.95);
      tl.set("#h-moon", { x: 0, y: -60, rotation: 0 }, 17.96);
      tl.set("#h-sun", { x: 40, y: -520, scale: 0.7, transformOrigin: "50% 50%" }, 17.96);
      tl.set("#h-bowl", { x: 0, y: 160, rotation: 0 }, 17.96);
      tl.set("#h-cloud", { x: 0, y: 200 }, 17.96);
      tl.set("#h-cloudbody", { scale: 1, transformOrigin: "50% 70%" }, 17.96);
      tl.set(["#h-glow"], { autoAlpha: 0 }, 17.96);
      tl.set(".h-food", { x: 0, y: 0, scale: 1, autoAlpha: 1 }, 17.96);
      ["#h-moon", "#h-sun", "#h-bowl", "#h-cloud"].forEach((s, i) => {
        tl.to(s, { autoAlpha: 1, duration: 0.15 }, 18.1 + i * 0.3);
        tl.fromTo(s, { y: "+=70" }, { y: "-=70", duration: 0.4, ease: "back.out(2)", immediateRender: false }, 18.1 + i * 0.3);
      });
      fadeUp("#lb6", 20.3, 0.35, 24);
      ["#h-moon", "#h-sun", "#h-bowl", "#h-cloud"].forEach((s, i) => {
        [0, 1, 2, 3].forEach((k) => tl.to(s, { x: `+=${[60, -60, 60, -60][(i + k) % 4]}`, y: `+=${[-40, 40, -40, 40][(i + k) % 4]}`, duration: 0.3, ease: "sine.inOut" }, 20.4 + k * 0.3));
      });
      [20.5, 20.9, 21.3].forEach((t, k) => tl.to(".o-pupil", { x: [-10, 10, 0][k], duration: 0.14, ease: "power2.out" }, t));
      tl.to(["#h-moon", "#h-sun", "#h-bowl", "#h-cloud", "#lb6"], { autoAlpha: 0, duration: 0.25 }, 22.15);

      // 3 · The wipe opens from the orb, and the name drops in over two threads.
      tl.fromTo("#l3-wipe", { scale: 0, svgOrigin: "540 1020" }, { scale: 1, svgOrigin: "540 1020", duration: 0.45, ease: "power3.inOut" }, 22.45);
      fadeUp("#l3-built", 22.6, 0.35, 24);
      tl.fromTo(".l3-l", { yPercent: -120, autoAlpha: 0 }, { yPercent: 0, autoAlpha: 1, duration: 0.36, ease: "back.out(1.6)", stagger: 0.035 }, 23.12);
      draw("#l3-t1, #l3-t2", 23.55, 0.5);

      // 4 · Sleep, meals, movement, mind pop on their words and thread into the orb; then one thing.
      tl.set(["#l4-card", ".l4-p"], { autoAlpha: 0 }, 0);
      pop("#l4-orb", 24.32, 0.5, 0.5);
      [25.76, 26.56, 27.36, 28.16].forEach((t, i) => {
        tl.fromTo(document.querySelectorAll(".l4-p")[i], { scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(1.8)" }, t);
      });
      [25.86, 26.66, 27.46, 28.26].forEach((t, i) => draw(`.l4-th:nth-of-type(${i + 1})`, t, 0.4, "power2.out"));
      tl.to(".l4-p", { scale: 0.6, autoAlpha: 0, duration: 0.3, ease: "power2.in", stagger: 0.05 }, 28.7);
      tl.to(".l4-th", { autoAlpha: 0, duration: 0.3 }, 28.75);
      tl.to("#l4-orb", { y: -140, duration: 0.45, ease: E }, 28.85);
      tl.fromTo("#l4-card", { y: 80, autoAlpha: 0, scale: 0.9 }, { y: 0, autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 29.15);
      tl.set("#l4-ckc", { scale: 0, transformOrigin: "50% 50%" }, 0);
      tl.to("#l4-ckc", { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 30.9);
      draw("#l4-ck", 30.98, 0.28, "power2.out");
      tl.to("#l4-orb", { y: -200, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 31.1);

      // 5 · Less guessing. More you. The name, and one thing to do.
      document.querySelectorAll(".l5-sp").forEach((el, i) => pop(el, 31.78 + i * 0.07, 0.45));
      drift(".l5-sp", 31.75, 4.25, 40);
      slam("#l5-a", 31.84, 1.4);
      tl.fromTo("#l5-b", { clipPath: "inset(0 100% 0 0)", autoAlpha: 1 }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.out" }, 32.7);
      fadeUp("#l5-mark", 33.5, 0.45, 30);
      pop("#l5-pill", 33.95, 0.45, 0.6);

      // The tweens above are written in the seconds of the take they were first cut to. WARP (written by
      // retime.py) maps those seconds onto the current voice, word by word, so each one lands on its word.
      const WARP = /* warp:start */[[0, 0]]/* warp:end */;
      const warp = (t) => {
        for (let i = 1; i < WARP.length; i++) {
          const [a0, b0] = WARP[i - 1];
          const [a1, b1] = WARP[i];
          if (t <= a1) return b0 + ((t - a0) * (b1 - b0)) / (a1 - a0);
        }
        const [a, b] = WARP[WARP.length - 1];
        return b + t - a;
      };
      tl.getChildren(false, true, false).forEach((child) => child.startTime(warp(child.startTime())));

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
