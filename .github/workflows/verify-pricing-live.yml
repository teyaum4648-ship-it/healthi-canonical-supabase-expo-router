name: One-time web-first checkout deployment smoke
on:
  push:
    branches: [feature/web-first-revenuecat-checkout-2026]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/web-first-revenuecat-checkout-2026
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test live pricing, safe checkout, legal changes and homepage
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://daywovenapp.com';
          const check=async (path,expected,needles) => {
            const res=await fetch(origin+path, {redirect:'manual'});
            const html=await res.text();
            console.log(path,res.status,html.length);
            assert.equal(res.status,expected);
            for(const needle of needles)assert.ok(html.includes(needle),path+' missing '+needle);
            return {res,html};
          };
          const {res:pricing,html}=await check('/pricing',200,['Daywoven Membership','Monthly','Annual','Complete your free assessment first']);
          assert.ok(!html.includes('href="/pricing/checkout?'));
          assert.equal(pricing.headers.get('referrer-policy'),'no-referrer');
          await check('/pricing/checkout?session=garbage&plan=monthly',400,['Start with your free Daywoven']);
          const validShape='A'.repeat(60)+'.'+'B'.repeat(43);
          const result=await fetch(origin+'/pricing/checkout?session='+validShape+'&plan=annual',{redirect:'manual'});
          assert.equal(result.status,302);
          assert.ok(result.headers.get('location')?.startsWith('https://lhqpexnepgvuohmhltnr.supabase.co/functions/v1/web-checkout?'));
          await check('/legal/terms.html',200,['RevenueCat Billing','Stripe','Website subscriptions']);
          await check('/legal/refunds.html',200,['Website purchases','Apple purchases']);
          await check('/legal/privacy.html',200,['RevenueCat','Stripe']);
          await check('/',200,['Daywoven']);
          const food=await fetch(origin+'/api/food-search?q=');
          assert.equal(food.status,400);
          assert.equal((await food.json()).error,'invalid_query');
          console.log('Production website smoke checks passed');
          NODE
      - name: Remove one-time smoke workflow on success
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-pricing-live.yml
          git commit -m 'Verify deployed Daywoven pricing and legal website'
          git push origin HEAD:feature/web-first-revenuecat-checkout-2026
