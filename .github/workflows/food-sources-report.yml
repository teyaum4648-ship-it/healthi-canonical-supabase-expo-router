# Reports how the public food sources answer real searches, so search changes are made
# against measured behaviour rather than guesses. Read-only: prints to the log, commits
# nothing.
name: Food sources report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Brand-plus-product searches
        run: |
          cat > report.mjs <<'EOF'
          const UA = { 'User-Agent': 'Healthi/0.1 (food source report)', Accept: 'application/json' };
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const get = async (url) => {
            for (let attempt = 0; attempt < 3; attempt += 1) {
              try {
                const r = await fetch(url, { headers: UA, signal: AbortSignal.timeout(30000) });
                if (r.ok) return await r.json();
                if (r.status !== 503 && r.status !== 429) return { error: `HTTP ${r.status}` };
              } catch (e) { if (attempt === 2) return { error: String(e) }; }
              await sleep(12000);
            }
            return { error: 'gave up' };
          };
          const fields = 'code,product_name,brands,brands_tags,countries_tags';
          const legacy = (q, extra = '') => `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&fields=${fields}&page_size=24${extra}`;
          const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
          const cases = [
            ['chobani', 'greek yogurt'], ['fage', 'total 0'], ['siggis', 'vanilla yogurt'], ['oikos', 'triple zero'],
            ['daves killer bread', 'good seed'], ['kind', 'dark chocolate nuts sea salt'], ['rxbar', 'chocolate sea salt'],
            ['quest', 'cookies and cream bar'], ['barebells', 'caramel cashew'], ['fairlife', 'core power'],
            ['premier protein', 'chocolate shake'], ['olipop', 'vintage cola'], ['simple mills', 'almond flour crackers'],
            ['siete', 'tortilla chips'], ['ghost', 'protein'], ['clif', 'builders bar']
          ];
          for (const [brand, product] of cases) {
            const q = `${brand} ${product}`;
            const plain = await get(legacy(q));
            const rows = plain.products ?? [];
            const branded = rows.filter(p => norm(p.brands).includes(norm(brand)));
            const nameHasBrand = branded.filter(p => norm(p.product_name).includes(norm(brand))).length;
            console.log(`\n[${q}] plain: count=${plain.count ?? plain.error} top24=${rows.length} brandInTop24=${branded.length} (of those, brand also in name: ${nameHasBrand})`);
            for (const p of rows.slice(0, 4)) console.log(`   plain  ${p.brands ?? '-'} | ${p.product_name ?? '-'}`);
            await sleep(7000);
            const productOnly = await get(legacy(product));
            const poRows = productOnly.products ?? [];
            console.log(`   product words only: count=${productOnly.count ?? productOnly.error} brandInTop24=${poRows.filter(p => norm(p.brands).includes(norm(brand))).length}`);
            await sleep(7000);
            const suggest = await get(`https://world.openfoodfacts.org/api/v3/taxonomy_suggestions?tagtype=brands&string=${encodeURIComponent(brand)}&limit=5`);
            console.log(`   suggest v3: ${JSON.stringify(suggest).slice(0, 400)}`);
            const tag = (suggest.suggestions?.[0] && typeof suggest.suggestions[0] === 'string') ? suggest.suggestions[0] : null;
            const guessTag = norm(brand).replace(/ /g, '-');
            const filtered = await get(legacy(product, `&tagtype_0=brands&tag_contains_0=contains&tag_0=${encodeURIComponent(guessTag)}`));
            const fRows = filtered.products ?? [];
            console.log(`   brand filter (${guessTag}) + "${product}": count=${filtered.count ?? filtered.error}`);
            for (const p of fRows.slice(0, 4)) console.log(`   filter ${p.brands ?? '-'} | ${p.product_name ?? '-'}`);
            await sleep(7000);
          }
          EOF
          node report.mjs
