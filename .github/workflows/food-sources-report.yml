# Reports how the public food sources answer real searches, so search changes are made
# against measured behaviour rather than guesses. Read-only: prints to the log, commits
# nothing.
name: Food sources report

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'One brand-plus-product search to trace (blank runs the full report)'
        required: false
        default: ''
      reliability:
        description: 'Measure how often the catalogue answers each way of asking'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.query != '' || inputs.reliability }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ (inputs.query != '' || inputs.reliability) && 'npm' || '' }}

      - name: Install the app's dependencies
        if: ${{ inputs.query != '' || inputs.reliability }}
        run: npm ci

      - name: How often the catalogue answers
        if: ${{ inputs.reliability }}
        env:
          HEALTHI_TRACE_RELIABILITY: '1'
          HEALTHI_TRACE_OUT: ${{ runner.temp }}/food-search-reliability.txt
        run: |
          npx vitest run tests/features/nutrition/foodSearchTrace.live.test.ts
          cat "$HEALTHI_TRACE_OUT"

      - name: Trace one search through the app's own code
        if: ${{ inputs.query != '' }}
        env:
          HEALTHI_TRACE_SEARCH: ${{ inputs.query }}
          HEALTHI_TRACE_OUT: ${{ runner.temp }}/food-search-trace.txt
        run: |
          npx vitest run tests/features/nutrition/foodSearchTrace.live.test.ts
          cat "$HEALTHI_TRACE_OUT"

      - name: Trace one search
        if: ${{ inputs.query != '' }}
        env:
          QUERY: ${{ inputs.query }}
        run: |
          cat > trace.mjs <<'EOF'
          const UA = { 'User-Agent': 'Healthi/0.1 (food source report)', Accept: 'application/json' };
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const get = async (url) => {
            for (let attempt = 0; attempt < 4; attempt += 1) {
              try {
                const r = await fetch(url, { headers: UA, signal: AbortSignal.timeout(30000) });
                if (r.ok) return await r.json();
                if (r.status !== 503 && r.status !== 429) return { error: `HTTP ${r.status}` };
              } catch (e) { if (attempt === 3) return { error: String(e) }; }
              await sleep(15000);
            }
            return { error: 'gave up' };
          };
          const norm = (s) => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
          const q = norm(process.env.QUERY);
          const [first, ...restWords] = q.split(' ');
          const rest = restWords.join(' ');
          const row = (p) => `${p.code} | ${p.brands || '(no brand)'} | ${p.product_name || p.product_name_en || '(no name)'} | ${(p.countries_tags ?? []).join(' ')}`;
          const legacy = (terms, extra = '', size = 24) => `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(terms)}&search_simple=1&action=process&json=1&fields=code,product_name,product_name_en,brands,countries_tags&page_size=${size}${extra}`;
          const US = '&tagtype_0=countries&tag_contains_0=contains&tag_0=united-states';
          const candidates = new Set();
          const show = (label, data, pick = () => true) => {
            const rows = data.products ?? data.hits ?? [];
            console.log(`\n${label}: count=${data.count ?? data.error}`);
            for (const p of rows.filter(pick).slice(0, 12)) console.log(`   ${row({ ...p, brands: Array.isArray(p.brands) ? p.brands.join(', ') : p.brands })}`);
          };
          const mentionsFirst = (p) => norm(`${Array.isArray(p.brands) ? p.brands.join(' ') : p.brands} ${p.product_name ?? ''} ${p.product_name_en ?? ''}`).split(' ').some(w => w.startsWith(first.replace(/s$/, '')));
          show(`A. "${q}", US only (what the app sends first)`, await get(legacy(q, US))); await sleep(8000);
          show(`B. "${q}", any country`, await get(legacy(q))); await sleep(8000);
          const productWords = await get(legacy(rest, US, 100)); await sleep(8000);
          show(`C. "${rest}", US only, 100 rows — those that mention "${first}" anywhere`, productWords, mentionsFirst);
          for (const p of (productWords.products ?? []).filter(mentionsFirst)) candidates.add(p.code);
          const brands = new Map();
          for (const p of productWords.products ?? []) { const b = p.brands || '(no brand)'; brands.set(b, (brands.get(b) ?? 0) + 1); }
          console.log(`   brands among those 100: ${[...brands].sort((a, b) => b[1] - a[1]).slice(0, 15).map(([b, n]) => `${b} ${n}`).join(' · ')}`);
          console.log(`   rows with no brand: ${(productWords.products ?? []).filter(p => !p.brands).map(p => p.product_name).slice(0, 10).join(' / ')}`);
          for (const page of [1, 2]) {
            const list = await get(`https://world.openfoodfacts.org/api/v2/search?brands_tags=${encodeURIComponent(first)}&fields=code,product_name,product_name_en,brands,countries_tags&page_size=100&page=${page}`); await sleep(8000);
            const hits = (list.products ?? []).filter(p => restWords.some(w => w.length > 3 && norm(p.product_name || p.product_name_en).includes(w)));
            console.log(`\nD${page}. brand tag "${first}" page ${page}: ${list.count ?? list.error} products; named with a typed word:`);
            for (const p of hits.slice(0, 15)) { console.log(`   ${row(p)}`); candidates.add(p.code); }
          }
          show(`E. search-a-licious "${q}"`, await get(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&page_size=24&langs=en&fields=code,product_name,brands,countries_tags`));
          console.log('\nF. the candidate records, as the search index sees them');
          for (const code of [...candidates].slice(0, 6)) {
            const d = await get(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=code,product_name,product_name_en,generic_name,brands,brands_tags,countries_tags,categories,_keywords,lang,unique_scans_n,nutriments`);
            const p = d.product ?? {};
            const keys = new Set(p._keywords ?? []);
            console.log(`   ${row(p)} | lang=${p.lang} scans=${p.unique_scans_n ?? 0} kcal100g=${p.nutriments?.['energy-kcal_100g'] ?? '-'}`);
            console.log(`      brands_tags: ${(p.brands_tags ?? []).join(' ')} | categories: ${String(p.categories ?? '').slice(0, 120)}`);
            console.log(`      index words: ${[...keys].join(' ')}`);
            console.log(`      typed words absent (before the index's own singular forms): ${q.split(' ').filter(w => !keys.has(w) && !keys.has(w.replace(/s$/, ''))).join(', ') || 'none'}`);
            await sleep(1500);
          }
          EOF
          node trace.mjs

      - name: Why a branded product is missing from a brand-plus-product search
        if: ${{ inputs.query == '' && !inputs.reliability }}
        run: |
          cat > report.mjs <<'EOF'
          const UA = { 'User-Agent': 'Healthi/0.1 (food source report)', Accept: 'application/json' };
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const get = async (url) => {
            for (let attempt = 0; attempt < 3; attempt += 1) {
              try {
                const r = await fetch(url, { headers: UA, signal: AbortSignal.timeout(30000) });
                if (r.ok) return await r.json();
                if (r.status !== 503 && r.status !== 429) return { error: `HTTP ${r.status}` };
              } catch (e) { if (attempt === 2) return { error: String(e) }; }
              await sleep(15000);
            }
            return { error: 'gave up' };
          };
          const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
          const fields = 'code,product_name,product_name_en,generic_name,brands,brands_tags,countries_tags,categories_tags,_keywords,unique_scans_n,lang';
          // Exactly what the phone sends today: legacy keyword search, 24 rows, US filter.
          const legacy = (q, extra = '') => `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&fields=code,product_name,brands&page_size=24${extra}`;
          const US = '&tagtype_0=countries&tag_contains_0=contains&tag_0=united-states';
          const rank = (rows, codes) => { const i = (rows ?? []).findIndex(p => codes.has(p.code)); return i < 0 ? 'absent' : `#${i + 1}`; };
          // [typed query, brand tags to try, words the wanted product's name contains]
          const cases = [
            ['breyers butter pecan ice cream', ['breyers'], 'butter pecan'],
            ['chobani vanilla greek yogurt', ['chobani'], 'vanilla'],
            ['daves killer bread good seed', ['dave-s-killer-bread', 'daves-killer-bread'], 'good seed'],
            ['ben and jerrys half baked', ['ben-jerry-s', 'ben-jerrys', 'ben-and-jerry-s'], 'half baked'],
            ['halo top birthday cake ice cream', ['halo-top', 'halo-top-creamery'], 'birthday cake'],
            ['tillamook sharp cheddar cheese', ['tillamook'], 'sharp cheddar'],
            ['nature valley oats and honey granola bar', ['nature-valley'], 'oats'],
            ['annies mac and cheese', ['annie-s', 'annies', 'annie-s-homegrown'], 'mac'],
            ['kodiak pancake mix', ['kodiak-cakes', 'kodiak'], 'power'],
            ['fairlife chocolate milk', ['fairlife'], 'chocolate'],
            ['quest cookies and cream protein bar', ['quest-nutrition', 'quest'], 'cookies'],
            ['kind dark chocolate nuts sea salt bar', ['kind'], 'dark chocolate']
          ];
          const tally = { legacyUS: 0, legacyAll: 0, salicious: 0, brandFilter: 0, found: 0 };
          for (const [typed, tags, nameHas] of cases) {
            console.log(`\n=== "${typed}"`);
            // 1. The products themselves, straight from the brand, most scanned first.
            let brandTag = null, targets = [];
            for (const tag of tags) {
              const list = await get(`https://world.openfoodfacts.org/api/v2/search?brands_tags=${encodeURIComponent(tag)}&fields=${fields}&page_size=100&sort_by=unique_scans_n`);
              await sleep(7000);
              const rows = list.products ?? [];
              console.log(`  brand tag ${tag}: ${list.count ?? list.error} products`);
              if (!rows.length) continue;
              brandTag = tag;
              targets = rows.filter(p => norm(p.product_name || p.product_name_en).includes(norm(nameHas)));
              break;
            }
            if (!targets.length) { console.log(`  no product named "${nameHas}" found under ${tags.join(', ')}`); continue; }
            tally.found += 1;
            const words = norm(typed).split(' ');
            for (const p of targets.slice(0, 3)) {
              const keys = new Set(p._keywords ?? []);
              const missing = words.filter(w => !keys.has(w));
              console.log(`  target ${p.code} | ${p.brands} | ${p.product_name || p.product_name_en} | lang=${p.lang} scans=${p.unique_scans_n ?? 0}`);
              console.log(`     countries: ${(p.countries_tags ?? []).join(' ')}`);
              console.log(`     index words: ${[...keys].join(' ')}`);
              console.log(`     typed words NOT in its index: ${missing.length ? missing.join(', ') : 'none'}`);
            }
            const codes = new Set(targets.map(p => p.code));
            // 2. The app's current request, then without the country filter.
            const us = await get(legacy(typed, US)); await sleep(7000);
            const all = await get(legacy(typed)); await sleep(7000);
            console.log(`  legacy, US filter : count=${us.count ?? us.error} target=${rank(us.products, codes)}`);
            console.log(`  legacy, any country: count=${all.count ?? all.error} target=${rank(all.products, codes)}`);
            for (const p of (us.products ?? []).slice(0, 3)) console.log(`     US top: ${p.brands ?? '-'} | ${p.product_name ?? '-'}`);
            // 3. The newer relevance-ranked search engine.
            const sal = await get(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(typed)}&page_size=24&langs=en&fields=code,product_name,brands`);
            console.log(`  search-a-licious  : count=${sal.count ?? sal.error} target=${rank(sal.hits, codes)}`);
            for (const p of (sal.hits ?? []).slice(0, 3)) console.log(`     SAL top: ${Array.isArray(p.brands) ? p.brands.join(', ') : p.brands ?? '-'} | ${p.product_name ?? '-'}`);
            // 4. The rest of the words inside the brand.
            const brandWords = norm(targets[0].brands?.split(',')[0]).split(' ');
            const rest = words.filter((w, i) => !(i < brandWords.length && brandWords[i] === w)).join(' ');
            const inBrand = await get(legacy(rest, `&tagtype_0=brands&tag_contains_0=contains&tag_0=${encodeURIComponent(brandTag)}`)); await sleep(7000);
            console.log(`  legacy "${rest}" inside ${brandTag}: count=${inBrand.count ?? inBrand.error} target=${rank(inBrand.products, codes)}`);
            if (rank(us.products, codes) !== 'absent') tally.legacyUS += 1;
            if (rank(all.products, codes) !== 'absent') tally.legacyAll += 1;
            if (rank(sal.hits, codes) !== 'absent') tally.salicious += 1;
            if (rank(inBrand.products, codes) !== 'absent') tally.brandFilter += 1;
            const suggest = await get(`https://world.openfoodfacts.org/api/v3/taxonomy_suggestions?tagtype=brands&string=${encodeURIComponent(words[0])}&limit=8`);
            console.log(`  brand suggestions for "${words[0]}": ${JSON.stringify(suggest.suggestions ?? suggest).slice(0, 300)}`);
          }
          console.log(`\nTARGET FOUND IN TOP 24, of ${tally.found} cases: legacy+US ${tally.legacyUS}, legacy any ${tally.legacyAll}, search-a-licious ${tally.salicious}, inside brand ${tally.brandFilter}`);
          EOF
          node report.mjs
