# Reports what the public food sources actually contain, so importers are written
# against real data rather than guesses. Read-only: prints to the log, commits nothing.
name: Food sources report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report
        run: |
          cat > report.mjs <<'EOF'
          const UA = { 'User-Agent': 'Healthi/0.1 (food source report)', Accept: 'application/json' };
          const get = async (url, as = 'json') => {
            try {
              const r = await fetch(url, { headers: UA, signal: AbortSignal.timeout(30000) });
              if (!r.ok) return { error: `HTTP ${r.status}` };
              return as === 'json' ? await r.json() : await r.text();
            } catch (e) { return { error: String(e) }; }
          };
          const line = (...a) => console.log(...a);

          line('\n===== MENUSTAT (NYC Open Data qgc5-ecnb) =====');
          const sample = await get('https://data.cityofnewyork.us/resource/qgc5-ecnb.json?$limit=2');
          line('sample:', JSON.stringify(sample).slice(0, 3000));
          const keys = Array.isArray(sample) && sample[0] ? Object.keys(sample[0]) : [];
          line('columns:', keys.join(', '));
          const yearKey = keys.find(k => /year/i.test(k));
          if (yearKey) {
            const years = await get(`https://data.cityofnewyork.us/resource/qgc5-ecnb.json?$select=${yearKey},count(*)&$group=${yearKey}&$order=${yearKey}`);
            line('rows per year:', JSON.stringify(years));
          }
          const total = await get('https://data.cityofnewyork.us/resource/qgc5-ecnb.json?$select=count(*)');
          line('total rows:', JSON.stringify(total));
          const restKey = keys.find(k => /restaurant/i.test(k));
          if (restKey && yearKey) {
            const latest = await get(`https://data.cityofnewyork.us/resource/qgc5-ecnb.json?$select=max(${yearKey})`);
            line('latest year:', JSON.stringify(latest));
            const y = Array.isArray(latest) ? Object.values(latest[0] ?? {})[0] : null;
            if (y) {
              const chains = await get(`https://data.cityofnewyork.us/resource/qgc5-ecnb.json?$select=${restKey},count(*)&$where=${yearKey}=${encodeURIComponent(`'${y}'`)}&$group=${restKey}&$order=count(*) DESC&$limit=400`);
              line(`chains in ${y}:`, Array.isArray(chains) ? chains.length : JSON.stringify(chains));
              line(JSON.stringify(chains).slice(0, 6000));
            }
          }
          const page = await get('https://www.menustat.org/data.html', 'text');
          line('menustat.org download links:', typeof page === 'string' ? [...new Set(page.match(/href="[^"]+\.(?:xlsx|csv|zip)[^"]*"/gi) ?? [])].join('\n') : JSON.stringify(page));
          const meta = await get('https://data.cityofnewyork.us/api/views/qgc5-ecnb.json');
          line('dataset meta:', JSON.stringify({ name: meta.name, rowsUpdatedAt: meta.rowsUpdatedAt && new Date(meta.rowsUpdatedAt * 1000).toISOString(), license: meta.license, attribution: meta.attribution, category: meta.category }));

          line('\n===== OPEN FOOD FACTS: store-brand counts (US) =====');
          const brands = ['kirkland-signature', 'trader-joe-s', 'kroger', 'simple-truth', 'simple-truth-organic', 'private-selection', 'great-value', 'good-gather', '365-by-whole-foods-market', '365-everyday-value', 'whole-foods-market', 'signature-select', 'o-organics', 'members-mark', 'h-e-b', 'hill-country-fare', 'publix', 'wegmans', 'market-pantry', 'aldi', 'simply-nature', 'sprouts-farmers-market', 'costco', 'safeway', 'meijer', 'food-lion', 'target', 'walmart'];
          for (const b of brands) {
            const r = await get(`https://world.openfoodfacts.org/api/v2/search?brands_tags=${b}&countries_tags_en=united-states&fields=code&page_size=1`);
            const all = await get(`https://world.openfoodfacts.org/api/v2/search?brands_tags=${b}&fields=code&page_size=1`);
            line(`${b}: US ${r.count ?? JSON.stringify(r)} · all ${all.count ?? JSON.stringify(all)}`);
            await new Promise(res => setTimeout(res, 700));
          }

          line('\n===== OPEN FOOD FACTS: how queries behave (the app\'s legacy search URL) =====');
          const fields = 'code,product_name,brands,countries_tags';
          const legacy = (q, extra = '') => `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&fields=${fields}&page_size=8${extra}`;
          const show = async (label, url) => {
            const r = await get(url);
            const ps = r.products ?? [];
            line(`\n[${label}] count=${r.count ?? r.error}`);
            for (const p of ps.slice(0, 6)) line(`   ${p.brands ?? '-'} | ${p.product_name ?? '-'} | ${(p.countries_tags ?? []).includes('en:united-states') ? 'US' : ''}`);
            await new Promise(res => setTimeout(res, 7000));
          };
          await show('costco almond butter', legacy('costco almond butter'));
          await show('kirkland almond butter', legacy('kirkland almond butter'));
          await show('kirkland signature almond butter', legacy('kirkland signature almond butter'));
          await show('trader joes mandarin orange chicken', legacy('trader joes mandarin orange chicken'));
          await show("trader joe's mandarin orange chicken", legacy("trader joe's mandarin orange chicken"));
          await show('mandarin orange chicken + brand tag trader-joe-s', legacy('mandarin orange chicken', '&tagtype_0=brands&tag_contains_0=contains&tag_0=trader-joe-s'));
          await show('almond butter + brand tag kirkland-signature', legacy('almond butter', '&tagtype_0=brands&tag_contains_0=contains&tag_0=kirkland-signature'));
          await show('kroger greek yogurt', legacy('kroger greek yogurt'));
          await show('greek yogurt + brand tag kroger', legacy('greek yogurt', '&tagtype_0=brands&tag_contains_0=contains&tag_0=kroger'));
          await show('greek yogurt + country united-states', legacy('greek yogurt', '&tagtype_0=countries&tag_contains_0=contains&tag_0=united-states'));
          await show('greek yogurt (no filter)', legacy('greek yogurt'));

          line('\n===== OFF search-a-licious (the server path) =====');
          for (const q of ['trader joes mandarin orange chicken', 'kirkland signature almond butter', 'brands:"trader-joe-s" mandarin orange chicken']) {
            try {
              const r = await fetch('https://search.openfoodfacts.org/search', { method: 'POST', headers: { ...UA, 'Content-Type': 'application/json' }, body: JSON.stringify({ q, langs: ['en'], fields: ['code', 'product_name', 'brands'], page_size: 6 }), signal: AbortSignal.timeout(30000) });
              const j = await r.json();
              line(`\n[SAL ${q}] count=${j.count ?? r.status}`);
              for (const h of (j.hits ?? []).slice(0, 6)) line(`   ${JSON.stringify(h.brands)} | ${h.product_name}`);
            } catch (e) { line(`[SAL ${q}] ${e}`); }
          }

          line('\n===== USDA FoodData Central downloads =====');
          const fdc = await get('https://fdc.nal.usda.gov/download-datasets', 'text');
          line(typeof fdc === 'string' ? [...new Set(fdc.match(/fdc-datasets\/[^"'\s]+\.zip/g) ?? [])].join('\n') : JSON.stringify(fdc));
          EOF
          node report.mjs
