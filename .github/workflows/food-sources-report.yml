# Reports what the public food sources actually contain, so importers are written
# against real data rather than guesses. Read-only: prints to the log, commits nothing.
name: Food sources report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report
        run: |
          cat > report.mjs <<'EOF'
          const UA = { 'User-Agent': 'Healthi/0.1 (food source report)', Accept: 'application/json' };
          const get = async (url, as = 'json') => {
            try {
              const r = await fetch(url, { headers: UA, signal: AbortSignal.timeout(30000) });
              if (!r.ok) return { error: `HTTP ${r.status}` };
              return as === 'json' ? await r.json() : await r.text();
            } catch (e) { return { error: String(e) }; }
          };
          const line = (...a) => console.log(...a);

          line('\n===== MENUSTAT on Harvard Dataverse =====');
          const found = await get('https://dataverse.harvard.edu/api/search?q=MenuStat&type=dataset&per_page=20');
          const items = found?.data?.items ?? [];
          for (const it of items) line(`dataset: ${it.global_id} | ${it.name} | ${it.published_at}`);
          for (const it of items.filter(i => /menustat/i.test(i.name)).slice(0, 4)) {
            const ds = await get(`https://dataverse.harvard.edu/api/datasets/:persistentId/?persistentId=${encodeURIComponent(it.global_id)}`);
            const files = ds?.data?.latestVersion?.files ?? [];
            line(`\n${it.global_id} license=${JSON.stringify(ds?.data?.latestVersion?.license ?? ds?.data?.latestVersion?.termsOfUse ?? null)}`);
            for (const f of files) line(`   file ${f.dataFile?.id} | ${f.label} | ${f.dataFile?.contentType} | ${f.dataFile?.filesize} | original=${f.dataFile?.originalFileFormat ?? ''}`);
            const latest = files.filter(f => /2018/.test(f.label)).concat(files).find(Boolean);
            if (latest) {
              const head = await get(`https://dataverse.harvard.edu/api/access/datafile/${latest.dataFile.id}?format=original`, 'text');
              const text = typeof head === 'string' ? head : JSON.stringify(head);
              line(`   first lines of ${latest.label}:\n` + text.split(/\r?\n/).slice(0, 4).join('\n').slice(0, 2500));
            }
          }

          line('\n===== OPEN FOOD FACTS: apostrophe-free store names (the app strips apostrophes) =====');
          const fields = 'code,product_name,brands,countries_tags';
          const legacy = (q, extra = '') => `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&fields=${fields}&page_size=8${extra}`;
          const show = async (label, url) => {
            let r = await get(url);
            if (r.error) { await new Promise(res => setTimeout(res, 15000)); r = await get(url); }
            line(`\n[${label}] count=${r.count ?? r.error}`);
            for (const p of (r.products ?? []).slice(0, 6)) line(`   ${p.brands ?? '-'} | ${p.product_name ?? '-'} | ${(p.countries_tags ?? []).includes('en:united-states') ? 'US' : ''}`);
            await new Promise(res => setTimeout(res, 8000));
          };
          await show('trader joes mandarin orange chicken', legacy('trader joes mandarin orange chicken'));
          await show('almond butter + brand kirkland-signature + US', legacy('almond butter', '&tagtype_0=brands&tag_contains_0=contains&tag_0=kirkland-signature&tagtype_1=countries&tag_contains_1=contains&tag_1=united-states'));
          await show('(empty terms) + brand trader-joe-s', legacy('', '&tagtype_0=brands&tag_contains_0=contains&tag_0=trader-joe-s'));
          await show('frozen pizza + brand great-value', legacy('frozen pizza', '&tagtype_0=brands&tag_contains_0=contains&tag_0=great-value'));
          await show('protein bar + US', legacy('protein bar', '&tagtype_0=countries&tag_contains_0=contains&tag_0=united-states'));
          EOF
          node report.mjs

      - name: USDA branded foods by store brand
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/b.zip" https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_branded_food_csv_2026-04-30.zip
          ls -la "$RUNNER_TEMP/b.zip"
          unzip -l "$RUNNER_TEMP/b.zip"
          unzip -q -j "$RUNNER_TEMP/b.zip" '*branded_food.csv' -d "$RUNNER_TEMP/b"
          python3 - "$RUNNER_TEMP/b/branded_food.csv" <<'PY'
          import csv, sys, collections
          csv.field_size_limit(10**9)
          stores = ['kirkland', "trader joe", 'kroger', 'simple truth', 'private selection', 'great value', 'good & gather', 'market pantry', '365', 'whole foods', 'signature select', "member's mark", 'h-e-b', 'publix', 'wegmans', 'aldi', 'meijer', 'costco', 'sprouts']
          owners = collections.Counter(); hits = collections.Counter(); total = 0; header = None
          with open(sys.argv[1], newline='', encoding='utf-8', errors='replace') as f:
              r = csv.DictReader(f)
              header = r.fieldnames
              for row in r:
                  total += 1
                  owner = (row.get('brand_owner') or '').strip(); brand = (row.get('brand_name') or '').strip()
                  owners[owner] += 1
                  text = f"{owner} | {brand}".lower()
                  for s in stores:
                      if s in text: hits[s] += 1
          print('columns:', header)
          print('rows:', total)
          for s in stores: print(f'{s}: {hits[s]}')
          print('top owners:', owners.most_common(40))
          PY
