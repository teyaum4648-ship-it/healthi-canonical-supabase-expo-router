name: One-time RevenueCat lockfile update
on:
  push:
    branches: [feature/daywoven-ios-subscriptions-release]
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daywoven-ios-subscriptions-release
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/prepare-subscription-lockfile.yml
          git commit -m 'Lock RevenueCat dependency for reproducible iOS builds'
          git push origin HEAD:feature/daywoven-ios-subscriptions-release
