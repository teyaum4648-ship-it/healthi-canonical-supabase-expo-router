name: One-time food search gateway compile
on:
  push:
    branches: [feature/daywoven-ios-subscriptions-release]
permissions:
  contents: write
jobs:
  compile-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daywoven-ios-subscriptions-release
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build-food-search-worker.cjs
      - name: Record exact deployed bundle and remove one-time workflow
        run: |
          mkdir -p release
          cp dist/server/index.js release/daywoven-food-search-worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/daywoven-food-search-worker.js
          git rm .github/workflows/prepare-food-search-worker.yml
          git commit -m 'Compile independent Daywoven food search Worker for release'
          git push origin HEAD:feature/daywoven-ios-subscriptions-release
